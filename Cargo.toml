[package]
name = "tuisample-code"
version = "0.3.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
ratatui = "0.26"
crossterm = "0.27"
reqwest = { version = "0.11", features = ["stream", "json"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
glob = "0.3"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
