# WebSocket upgrade, at http level so every per-app route can use it.
#
# This is one of the reasons hosting moved off Lambda: an API Gateway HTTP API
# cannot carry a WebSocket on the same route as HTTP, and Socket.IO's fallback
# to long-polling then ran into the 30-second timeout. Here it is three lines.
#
# The map exists because `Connection` must be "upgrade" only when the client
# actually asked to upgrade -- sending it unconditionally breaks keep-alive for
# ordinary requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
