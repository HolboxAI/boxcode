name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 (Intel) has been fully retired by GitHub -- a workflow
          # requesting it just queues forever, which is what actually
          # happened here (24h timeout waiting for a runner that no longer
          # exists). macos-14 is deprecated too, so this jumps straight to
          # the current images rather than trading one soon-to-vanish label
          # for another.
          - os: macos
            arch: x86_64
            runner: macos-15-large
            target: x86_64-apple-darwin
          - os: macos
            arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows
            arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux ARM)
        if: matrix.os == 'linux' && matrix.arch == 'aarch64'
        run: cargo install cross

      - name: Build (native)
        if: matrix.os != 'linux' || matrix.arch != 'aarch64'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.os == 'linux' && matrix.arch == 'aarch64'
        run: cross build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/tuisample-code artifacts/tuisample-code-${{ matrix.os }}-${{ matrix.arch }}
          chmod +x artifacts/tuisample-code-${{ matrix.os }}-${{ matrix.arch }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir artifacts
          copy target\${{ matrix.target }}\release\tuisample-code.exe artifacts\tuisample-code-${{ matrix.os }}-${{ matrix.arch }}.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuisample-code-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find all-artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate checksums
        # install.sh verifies a downloaded binary against this before
        # installing it -- see fetch_prebuilt_binary there. Generated after
        # every binary is in place and named the way install.sh expects
        # (`tuisample-code-$os-$arch`), so the sums line up with what it
        # will actually ask for.
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
