name: Build Matrix

# Reusable: called both by release.yml (which turns these artifacts into a
# published release) and pr-build-check.yml (which just wants to know
# whether every target still compiles, and throws the artifacts away).
# Kept in one place so the two callers can never drift apart on which
# platforms are actually supported -- see release.yml's own note on why
# there is no Intel-macOS entry.
on:
  workflow_call:

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          # x86_64 builds natively, so its glibc floor is the runner's. Pin
          # ubuntu-22.04 (glibc 2.35) rather than the floating `ubuntu-latest`
          # (glibc 2.39 today, heading to 2.43): glibc is backward- but not
          # forward-compatible, so a binary built on `ubuntu-latest` refuses to
          # start on any distro with an older glibc ("GLIBC_x.yy not found").
          # aarch64 is built with `cross` below, so its glibc comes from the
          # cross Docker image rather than this runner.
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows
            arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux ARM)
        if: matrix.os == 'linux' && matrix.arch == 'aarch64'
        run: cargo install cross

      - name: Build (native)
        if: matrix.os != 'linux' || matrix.arch != 'aarch64'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.os == 'linux' && matrix.arch == 'aarch64'
        run: cross build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/boxcode artifacts/boxcode-${{ matrix.os }}-${{ matrix.arch }}
          chmod +x artifacts/boxcode-${{ matrix.os }}-${{ matrix.arch }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir artifacts
          copy target\${{ matrix.target }}\release\boxcode.exe artifacts\boxcode-${{ matrix.os }}-${{ matrix.arch }}.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boxcode-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/
