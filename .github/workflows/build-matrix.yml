name: Build Matrix

# Reusable: called both by release.yml (which turns these artifacts into a
# published release) and pr-build-check.yml (which just wants to know
# whether every target still compiles, and throws the artifacts away).
# Kept in one place so the two callers can never drift apart on which
# platforms are actually supported -- see release.yml's own note on why
# there is no Intel-macOS entry.
on:
  workflow_call:

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows
            arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux ARM)
        if: matrix.os == 'linux' && matrix.arch == 'aarch64'
        run: cargo install cross

      - name: Build (native)
        if: matrix.os != 'linux' || matrix.arch != 'aarch64'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.os == 'linux' && matrix.arch == 'aarch64'
        run: cross build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/tuisample-code artifacts/tuisample-code-${{ matrix.os }}-${{ matrix.arch }}
          chmod +x artifacts/tuisample-code-${{ matrix.os }}-${{ matrix.arch }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir artifacts
          copy target\${{ matrix.target }}\release\tuisample-code.exe artifacts\tuisample-code-${{ matrix.os }}-${{ matrix.arch }}.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuisample-code-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/
